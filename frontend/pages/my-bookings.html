<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>การจองของฉัน | ระบบจองห้องออนไลน์</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div id="navbar" class="navbar"></div>

  <div class="container">
    <div class="page-header">
      <h1>การจองของฉัน</h1>
      <p>ติดตามสถานะคำขอจองห้อง และยกเลิกการจองที่ยังไม่ต้องการ</p>
    </div>

    <div id="alertBox" class="hidden"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ห้อง</th>
            <th>วันที่</th>
            <th>เวลา</th>
            <th>วัตถุประสงค์</th>
            <th>สถานะการจอง</th>
            <th>การชำระเงิน</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="bookingRows"></tbody>
      </table>
    </div>
    <div id="emptyState" class="empty-state hidden">คุณยังไม่มีรายการจอง</div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
  <script>
    const user = requireAuth();
    renderNavbar("my-bookings");

    const alertBox = document.getElementById("alertBox");
    const bookingRows = document.getElementById("bookingRows");
    const emptyState = document.getElementById("emptyState");

    let paymentsByBooking = {};

    function paymentCell(b) {
      const payment = paymentsByBooking[b._id];
      if (payment) return statusBadge(payment.payment_status);
      if (b.status === "approved") {
        return `<button class="btn btn-primary btn-sm" onclick="togglePayForm('${b._id}')">แจ้งชำระเงิน</button>`;
      }
      return `<span class="meta">-</span>`;
    }

    function rowHtml(b) {
      const cancellable = ["pending", "approved"].includes(b.status);
      return `
        <tr>
          <td>${b.room_id ? b.room_id.room_name : "-"}</td>
          <td>${formatDate(b.booking_date)}</td>
          <td>${b.start_time} - ${b.end_time}</td>
          <td>${b.purpose || "-"}</td>
          <td>${statusBadge(b.status)}</td>
          <td>${paymentCell(b)}</td>
          <td>${cancellable ? `<button class="btn btn-outline btn-sm" onclick="cancelBooking('${b._id}')">ยกเลิก</button>` : ""}</td>
        </tr>
        <tr id="pay-row-${b._id}" class="hidden">
          <td colspan="7">
            <form onsubmit="submitPayment(event, '${b._id}')" style="max-width:360px;">
              <div class="field">
                <label>จำนวนเงิน (บาท)</label>
                <input type="number" name="amount" min="0" step="0.01" required />
              </div>
              <div class="field">
                <label>ช่องทางการชำระเงิน</label>
                <select name="payment_method" required>
                  <option value="โอนเงินผ่านธนาคาร">โอนเงินผ่านธนาคาร</option>
                  <option value="พร้อมเพย์">พร้อมเพย์</option>
                  <option value="เงินสด">เงินสด</option>
                </select>
              </div>
              <div class="field">
                <label>หลักฐานการชำระเงิน</label>
                <input type="file" name="payment_proof" accept=".pdf,.jpg,.jpeg,.png" required />
              </div>
              <div id="pay-alert-${b._id}" class="hidden"></div>
              <button type="submit" class="btn btn-primary btn-sm">ส่งหลักฐานการชำระเงิน</button>
            </form>
          </td>
        </tr>
      `;
    }

    function togglePayForm(id) {
      document.getElementById(`pay-row-${id}`).classList.toggle("hidden");
    }

    async function submitPayment(e, bookingId) {
      e.preventDefault();
      const alertEl = document.getElementById(`pay-alert-${bookingId}`);
      alertEl.classList.add("hidden");

      const formData = new FormData(e.target);
      formData.append("booking_id", bookingId);

      try {
        await apiRequest("/payments", { method: "POST", body: formData, isForm: true });
        await load();
      } catch (err) {
        showAlert(alertEl, err.message);
      }
    }

    async function cancelBooking(id) {
      try {
        await apiRequest(`/bookings/${id}/cancel`, { method: "PATCH" });
        load();
      } catch (err) {
        showAlert(alertBox, err.message);
      }
    }

    async function load() {
      try {
        const [{ bookings }, { payments }] = await Promise.all([
          apiRequest("/bookings?mine=true"),
          apiRequest("/payments"),
        ]);

        paymentsByBooking = {};
        payments.forEach((p) => {
          if (p.booking_id && p.booking_id._id) paymentsByBooking[p.booking_id._id] = p;
        });

        bookingRows.innerHTML = bookings.map(rowHtml).join("");
        emptyState.classList.toggle("hidden", bookings.length > 0);
      } catch (err) {
        showAlert(alertBox, err.message);
      }
    }

    if (user) load();
  </script>
</body>
</html>
